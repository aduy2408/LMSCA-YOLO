# YOLOv8 Varroa H1-2H-A + KVCA on final Detect inputs:
# Follows the example_codebase KV-head placement more closely by applying
# KVCompressedAttention immediately before Detect, after the lightweight
# P3/P4 head convolutions have produced the final detect-input tensors.

nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, IRDCB, [512, 2.0, True]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, IRDCB, [256, 2.0, True]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, IRDCB, [128, 2.0, True]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, IRDCB, [256, 2.0, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, IRDCB, [512, 2.0, True]]

  - [[18, 21], 1, SAGRI, [256, 3, 0.0, 1.0]]
  - [25, 1, DeformableHeadConv, [256, 3, 0.0]]
  - [24, 1, DeformableHeadConv, [512, 3, 0.0]]
  - [26, 1, KVCompressedAttention, [256, 4, 4, dwconv]]
  - [27, 1, KVCompressedAttention, [512, 4, 2, dwconv]]

  - [[28, 29], 1, Detect, [nc]]
